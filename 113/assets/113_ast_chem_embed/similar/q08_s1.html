<section><h2>試題</h2><div class="qbox">AgCl 的莫耳溶解度為 1.3×10⁻⁵ M。估計 Ksp。</div></section>
<section><h2>答案</h2><p class="answer">1.7×10⁻¹⁰</p></section>
<section><h2>詳解</h2><p>AgCl ⇌ Ag⁺+Cl⁻，Ksp=s²=(1.3×10⁻⁵)²=1.69×10⁻¹⁰。</p></section>

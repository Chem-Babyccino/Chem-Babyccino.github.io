<header><div class="kicker">113 分科測驗化學｜原題解析</div><h1>第 15 題</h1><div class="tagrow"><span class="tag">原題不重刊</span><span class="tag">核心概念解析</span></div></header>
<section><h2>測驗核心概念</h2><p>大型有機分子的官能基辨識、氫鍵、混成軌域與氧化反應</p></section>
<section><h2>答案</h2><p class="answer">ABE</p></section>
<section><h2>詳解</h2>
<p>題圖中的紫杉醇有多個 O-H 與 C=O 與含 O 原子位置，可形成分子內氫鍵，因此 A 正確。結構中只有 1 個醚鍵 C-O-C，B 正確。</p>
<p>圖中 C=O 數量為 6 個，不是 5 個。分子中有多個 sp<sup>3</sup> 碳與環狀立體骨架，不可能整個分子平面化。分子內含二級醇，二級醇可被酸性二鉻酸鉀氧化為酮，因此 E 正確。</p></section>

<header><div class="kicker">113 分科測驗化學｜原題解析</div><h1>第 10 題</h1><div class="tagrow"><span class="tag">原題不重刊</span><span class="tag">核心概念解析</span></div></header>
<section><h2>測驗核心概念</h2><p>不飽和度、官能基通式、同分異構物判斷</p></section>
<section><h2>答案</h2><p class="answer">ABD</p></section>
<section><h2>詳解</h2>
<p>C<sub>4</sub>H<sub>8</sub>O<sub>2</sub> 的不飽和度為 1，可由一個 C=O、一個 C=C 或一個環造成。</p>
<div class="eq">DBE = <span class="frac"><span class="top">2C+2−H</span><span class="bottom">2</span></span> = <span class="frac"><span class="top">2×4+2−8</span><span class="bottom">2</span></span> = 1。</div>
<p>A：若為羧酸，可為丁酸或 2-甲基丙酸。B：若為二醇，分子中仍可能有 C=C 或環，具順反異構可能。C：乙酸丙酯有 5 個碳，式量為 C<sub>5</sub>H<sub>10</sub>O<sub>2</sub>，不符。D：四員環二醇等結構可符合。E：含羥基也可能同時含羰基，例如羥基醛或羥基酮，因此錯。</p></section>

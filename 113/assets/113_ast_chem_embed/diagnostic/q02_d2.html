<header><div class="kicker">113 分科測驗化學｜第 2 題核心概念延伸</div><h1>第 2 題｜診斷題 2</h1><div class="tagrow"><span class="tag">診斷式試題</span><span class="tag">核心：路易斯結構、鍵級與鍵長、VSEPR 與分子平面性</span></div></header>
<section><h2>試題</h2><div class="qbox">請比較 C–C、C=C、C≡C 的鍵長大小。</div></section>
<section><h2>答案</h2><p class="answer">C–C > C=C > C≡C</p></section>
<section><h2>詳解</h2><p>相同兩原子間，鍵級愈高，鍵長愈短；單鍵最長、三鍵最短。</p></section>
<section><h2>診斷重點</h2><p>用來檢查學生是否掌握原題核心概念，若答錯，通常代表基本定義或第一步判讀尚未穩定。</p></section>

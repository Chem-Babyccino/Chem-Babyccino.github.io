<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf5ec" />
    <title>113年化學分科測驗試題學習網頁</title>

      <main>
        <section id="homeView" class="view"></section>

        <section id="multipleView" class="view hidden"></section>

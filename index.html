<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf5ec" />
    <title>化學分科測驗試題學習網頁</title>
    <meta name="description" content="化學分科測驗歷年試題學習網頁入口：依年份進入逐題解析、試題定位與檢核練習。" />
    <style>
      :root { color-scheme: light; --bg:#edf5ec; --panel:rgba(253,255,250,.94); --ink:#183022; --muted:#61736a; --line:#cdddcf; --leaf:#557f45; --leaf-dark:#355f38; --moss:#8da36b; --soft:#e8f0df; --river:#3b7f8e; --cream:#fbf6e8; --shadow:0 18px 45px rgba(36,65,45,.14); }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif; background:radial-gradient(circle at 14% 12%,rgba(141,163,107,.24),transparent 24%),radial-gradient(circle at 84% 8%,rgba(59,127,142,.18),transparent 28%),linear-gradient(135deg,rgba(85,127,69,.14),transparent 36%),linear-gradient(225deg,rgba(197,139,54,.1),transparent 34%),var(--bg); }
      body:before, body:after { position:fixed; inset:0; z-index:-1; pointer-events:none; content:""; }
      body:before { opacity:.23; background:radial-gradient(ellipse 52px 18px at 8% 24%,rgba(65,112,70,.18) 0 48%,transparent 52%),radial-gradient(ellipse 46px 16px at 91% 18%,rgba(25,114,103,.14) 0 48%,transparent 52%); }
      body:after { opacity:.16; background-image:radial-gradient(circle at 22px 18px,rgba(81,121,71,.34) 0 1.5px,transparent 2px),radial-gradient(circle at 7px 42px,rgba(141,163,107,.32) 0 1px,transparent 1.5px); background-size:88px 76px,114px 94px; mask-image:linear-gradient(135deg,rgba(0,0,0,.55),transparent 72%); }
      .app { width:min(1180px,100%); margin:0 auto; padding:clamp(20px,4vw,54px); }
      header { display:grid; gap:10px; margin-bottom:28px; }
      .eyebrow { margin:0; color:#197267; font-size:13px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
      h1 { margin:0; font-size:clamp(36px,6vw,76px); line-height:1.04; letter-spacing:0; }
      .lead { max-width:760px; color:var(--muted); font-size:20px; line-height:1.8; }
      .years { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
      .year-card { display:grid; min-height:230px; gap:14px; padding:22px; border:1px solid var(--line); border-radius:8px; background:var(--panel); box-shadow:var(--shadow); color:inherit; text-decoration:none; }
      .year-card:hover { border-color:var(--leaf); transform:translateY(-2px); }
      .year { font-size:54px; font-weight:900; line-height:1; }
      .tagrow { display:flex; flex-wrap:wrap; gap:8px; }
      .tag { display:inline-flex; align-items:center; min-height:34px; padding:6px 10px; border-radius:999px; background:var(--soft); color:#245d3c; font-weight:900; }
      .year-card p { margin:0; color:var(--muted); line-height:1.7; }
      .disabled { opacity:.55; pointer-events:none; }
      footer { margin-top:28px; color:var(--muted); line-height:1.7; }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">Nature Chemistry Studio</p>
        <h1>化學分科測驗試題學習網頁</h1>
        <p class="lead">選擇年份進入學習站。每一年都保留自己的試題定位、逐題解析、診斷檢核與類題練習，之後新增年度時不會互相覆蓋。</p>
      </header>
      <section class="years" aria-label="年份選單">
        <a class="year-card" href="./112/">
          <div class="year">112</div>
          <div class="tagrow"><span class="tag">已發布</span><span class="tag">31 題</span><span class="tag">自然背景</span></div>
          <p>112 年化學分科測驗學習網頁：單選、多選、非選題工作區與檢核練習。</p>
        </a>
        <a class="year-card" href="./113/">
          <div class="year">113</div>
          <div class="tagrow"><span class="tag">保留</span><span class="tag">原版本</span></div>
          <p>113 年化學分科測驗學習網頁保留在獨立路徑，避免被新年度覆蓋。</p>
        </a>
        <a class="year-card disabled" href="#" aria-disabled="true">
          <div class="year">111</div>
          <div class="tagrow"><span class="tag">預留</span></div>
          <p>後續年度可照同樣結構新增。</p>
        </a>
      </section>
      <footer>建議使用最新版 Chrome、Edge 或 Safari。若頁面更新後仍看到舊版，請在網址後加上 <strong>?v=年份</strong> 重新整理。</footer>
    </main>
  </body>
</html>
